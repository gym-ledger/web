# Fixed, so the project (and its volumes) don't change with the folder name.
name: gym-ledger-web

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from the .env file at build time — NEXT_PUBLIC_* vars are baked in at build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_OPERATOR_NAME: ${NEXT_PUBLIC_OPERATOR_NAME:-}
        NEXT_PUBLIC_PRIVACY_CONTACT_EMAIL: ${NEXT_PUBLIC_PRIVACY_CONTACT_EMAIL:-}
    container_name: gym-ledger-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
